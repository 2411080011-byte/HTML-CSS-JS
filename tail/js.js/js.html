<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Responsive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      sidebar.classList.toggle("-translate-x-full");
      overlay.classList.toggle("hidden");
    }
  </script>
</head>
<body class="bg-gray-900 text-gray-100">

<div class="flex h-screen">

  <!-- Overlay (solo en móvil) -->
  <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 hidden lg:hidden z-30"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-64 bg-gray-800 flex flex-col border-r border-gray-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out z-40">
    
    <!-- Logo con más espacio arriba -->
    <div class="h-20 flex items-center px-6 border-b border-gray-700">
      <svg class="h-7 w-7 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      <span class="ml-3 text-lg font-semibold">Logo</span>
    </div>

    <!-- Apartados -->
    <nav class="flex-1 px-3 py-4 overflow-hidden">
      <ul class="space-y-1">
        <li>
          <a href="#" class="flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md bg-gray-900">
            <div class="flex items-center gap-3">
              <svg class="h-5 w-5 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7m-9 2v8m0 0H5a2 2 0 01-2-2V10a2 2 0 012-2h3m4 12h4a2 2 0 002-2v-6a2 2 0 00-2-2h-4"/>
              </svg>
              Dashboard
            </div>
            <span class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">5</span>
          </a>
        </li>

        <li>
          <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            👥 Team
          </a>
        </li>

        <li>
          <a href="#" class="flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            <div class="flex items-center gap-3">📂 Projects</div>
            <span class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">12</span>
          </a>
        </li>

        <li>
          <a href="#" class="flex items-center justify-between px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            <div class="flex items-center gap-3">📅 Calendar</div>
            <span class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">20+</span>
          </a>
        </li>

        <li>
          <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            📑 Documents
          </a>
        </li>
        <!-- Eliminado Reports -->
      </ul>

      <!-- Divider -->
      <div class="mt-6 mb-2 text-xs font-semibold text-gray-400 uppercase">Your teams</div>
      <ul class="space-y-1">
        <li>
          <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            <span class="flex h-6 w-6 items-center justify-center rounded-lg bg-gray-700 text-xs">H</span>
            Heroicons
          </a>
        </li>
        <li>
          <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            <span class="flex h-6 w-6 items-center justify-center rounded-lg bg-gray-700 text-xs">T</span>
            Tailwind Labs
          </a>
        </li>
        <li>
          <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-700">
            <span class="flex h-6 w-6 items-center justify-center rounded-lg bg-gray-700 text-xs">W</span>
            Workstation
          </a>
        </li>
      </ul>
    </nav>

    <!-- Usuario -->
    <div class="p-4 border-t border-gray-700 flex items-center gap-3">
      <img class="w-8 h-8 rounded-full" src="https://i.pravatar.cc/40" alt="User">
      <p class="text-sm font-medium">Tom Cook</p>
    </div>
  </aside>

  <!-- Contenido principal -->
  <div class="flex-1 flex flex-col">
    <!-- Header móvil -->
    <header class="lg:hidden flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700">
      <button onclick="toggleSidebar()" class="text-gray-200">
        ☰
      </button>
      <h1 class="text-lg font-semibold">Mi App</h1>
    </header>

    <!-- Main -->
    <main class="flex-1 p-6">
      <h2 class="text-2xl font-semibold text-white mb-4">Contenido principal</h2>
      <p class="text-gray-300">Sidebar sin scroll y con espacio en el logo.</p>
    </main>
  </div>
</div>

</body>
</html>
